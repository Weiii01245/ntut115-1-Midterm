<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4aafb" />
    <meta name="description" content="認識草台班子的店員與角色。" />
    <title>僕人名錄｜草台班子</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/site.js" defer></script>
  </head>
  <body>
    <button class="menu-sticker" type="button" aria-expanded="false" aria-controls="page-menu">MENU</button>
    <aside class="bubble-overlay" id="page-menu" aria-hidden="true" aria-label="頁面跳轉選單">
      <nav class="bubble-menu-items"><a class="bubble-pill" href="index.html" style="--bubble-tilt:-6deg;--bubble-delay:0ms">首頁 <span>↗</span></a><a class="bubble-pill" href="menu.html" style="--bubble-tilt:5deg;--bubble-delay:90ms">菜單 <span>↗</span></a><a class="bubble-pill" href="staff.html" style="--bubble-tilt:-4deg;--bubble-delay:180ms">僕人名錄 <span>↗</span></a><a class="bubble-pill" href="index.html#visit" style="--bubble-tilt:6deg;--bubble-delay:270ms">來店須知 <span>↗</span></a></nav>
    </aside>
    <button class="bubble-menu-backdrop" type="button" aria-label="關閉選單" tabindex="-1"></button>
    <header class="site-header">
      <a class="brand-mark" href="index.html" aria-label="草台班子首頁"><img src="assets/images/figma-image-4.png" alt="草台班子塗鴉標誌" /></a>
      <a class="phone-pill" href="tel:000000000">☎ <span>0000-000-000</span></a>
    </header>

    <main class="staff-page">
      <section class="staff-heading section-wrap">
        <p class="eyebrow">MEET OUR LITTLE CREW</p>
        <h1>僕人名錄 <span aria-hidden="true">✷</span></h1>
        <p>認識今天的草台班子成員</p>
      </section>

      <section class="staff-gallery" data-staff-gallery tabindex="0" role="region" aria-label="店員拍立得輪播" aria-describedby="staff-wheel-hint">
        <button class="staff-arrow staff-prev" type="button" data-staff-prev aria-label="上一位店員">←</button>
        <div class="staff-stage">
          <article class="staff-slide is-active" data-staff-slide aria-label="蠑螈，1 / 4">
            <button class="staff-polaroid" type="button" data-staff-detail aria-label="查看蠑螈全身立繪"><span class="staff-photo"><img src="assets/images/staff/店員1.PNG" alt="蠑螈角色立繪" /></span><span class="staff-caption"><span>STAFF NO. 01</span><strong>蠑螈</strong></span></button>
          </article>
          <article class="staff-slide" data-staff-slide aria-label="大力，2 / 4" aria-hidden="true">
            <button class="staff-polaroid" type="button" data-staff-detail aria-label="查看大力全身立繪"><span class="staff-photo"><img src="assets/images/staff/店員2.PNG" alt="大力角色立繪" /></span><span class="staff-caption"><span>STAFF NO. 02</span><strong>大力</strong></span></button>
          </article>
          <article class="staff-slide" data-staff-slide aria-label="莓茗子，3 / 4" aria-hidden="true">
            <button class="staff-polaroid" type="button" data-staff-detail aria-label="查看莓茗子全身立繪"><span class="staff-photo"><img src="assets/images/staff/店員3.PNG" alt="莓茗子角色立繪" /></span><span class="staff-caption"><span>STAFF NO. 03</span><strong>莓茗子</strong></span></button>
          </article>
          <article class="staff-slide" data-staff-slide aria-label="草阿貴，4 / 4" aria-hidden="true">
            <button class="staff-polaroid" type="button" data-staff-detail aria-label="查看草阿貴全身立繪"><span class="staff-photo"><img src="assets/images/staff/草阿貴.png" alt="草阿貴角色立繪" /></span><span class="staff-caption"><span>STAFF NO. 04</span><strong>草阿貴</strong></span></button>
          </article>
        </div>
        <button class="staff-arrow staff-next" type="button" data-staff-next aria-label="下一位店員">→</button>
        <span class="staff-sticker" aria-hidden="true">NICE<br />TO<br />MEET U!</span>
      </section>

      <div class="staff-controls" aria-label="店員輪播控制">
        <div class="staff-dots" role="group" aria-label="直接選擇店員">
          <button class="staff-dot is-current" type="button" data-staff-dot="0" aria-label="顯示蠑螈" aria-current="true"></button>
          <button class="staff-dot" type="button" data-staff-dot="1" aria-label="顯示大力"></button>
          <button class="staff-dot" type="button" data-staff-dot="2" aria-label="顯示莓茗子"></button>
          <button class="staff-dot" type="button" data-staff-dot="3" aria-label="顯示草阿貴"></button>
        </div>
        <p id="staff-wheel-hint">滑動滑鼠滾輪切換店員 <span aria-hidden="true">↑ ↓</span></p>
        <p class="staff-status" data-staff-status aria-live="polite">蠑螈 ・ 1 / 4</p>
      </div>
    </main>

    <dialog class="staff-detail" data-staff-dialog aria-label="店員全身立繪"><button class="staff-detail-close" type="button" aria-label="關閉介紹">×</button><div class="staff-detail-art"><img data-detail-image alt="" /></div><div class="staff-detail-layout" aria-hidden="true"><span></span><span></span><span></span></div></dialog>

    <footer class="site-footer"><a class="footer-title" href="index.html">草台班子</a><p class="footer-quote"><span>蘭亭集序</span> 永和九年，歲在癸丑，暮春之初，會於會稽山陰之蘭亭，修禊事也。群賢畢至，少長咸集。此地有崇山峻嶺，茂林修竹，又有清流激湍，映帶左右，引以為流觴曲水，列坐其次。雖無絲竹管弦之盛，一觴一詠，亦足以暢敘幽情。</p><div class="footer-meta"><span>咖啡・甜點・午後</span><span>營業資訊與餐點內容以店內公告為準</span><span>© 2026 草台班子</span><span class="footer-socials"><span class="footer-social"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.3"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.3"/><circle cx="18" cy="6" r="1.3" fill="currentColor"/></svg> IG</span><span class="footer-social"><svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M13.7 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5H17V3.6c-.3 0-1.2-.1-2.3-.1-2.4 0-4 1.5-4 4.2v2.3H8v3.1h2.7v8z"/></svg> FB</span></span></div></footer>
  </body>
</html>
